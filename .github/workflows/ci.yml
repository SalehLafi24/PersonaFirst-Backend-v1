name: CI

on:
  push:
    branches: [main, partial-test]
  pull_request:
    branches: [main, partial-test]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    env:
      # The suite runs on in-memory SQLite (tests/conftest.py). app.main also
      # calls Base.metadata.create_all(bind=engine) at import, so point the app
      # engine at SQLite too — that keeps CI free of any Postgres dependency.
      DATABASE_URL: "sqlite:///./ci.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
